<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Product Review Form for WDD 131 allowing users to rate and review products.">
    <meta name="author" content="Joseph Silas Ukandu">
    <title>Product Review Form</title>
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>
<body>
    <header>
        <!-- Exact audit requirement: <h1>Product Review</h1> -->
        <h1>Product Review</h1>
    </header>

    <main>
        <form method="get" action="review.html">
            
            <div class="form-group">
                <label for="productName">Product Name:</label>
                <!-- Exact audit requirement: "Select a Product ..." -->
                <select id="productName" name="productName" required>
                    <option value="" disabled selected>Select a Product ...</option>
                </select>
            </div>

            <div class="form-group">
                <label>Overall Rating:</label>
                <div class="rating-container">
                    <label><input type="radio" id="rating1" name="rating" value="1" required> 1 ☆</label>
                    <label><input type="radio" id="rating2" name="rating" value="2"> 2 ☆</label>
                    <label><input type="radio" id="rating3" name="rating" value="3"> 3 ☆</label>
                    <label><input type="radio" id="rating4" name="rating" value="4"> 4 ☆</label>
                    <label><input type="radio" id="rating5" name="rating" value="5"> 5 ☆</label>
                </div>
            </div>

            <div class="form-group">
                <label for="installDate">Date of Installation:</label>
                <input type="date" id="installDate" name="installDate" required>
            </div>

            <div class="form-group">
                <label>Useful Features (Check all that apply):</label>
                <div class="features-container">
                    <label><input type="checkbox" id="feature1" name="features" value="durability"> Durability</label>
                    <label><input type="checkbox" id="feature2" name="features" value="easeOfUse"> Ease of Use</label>
                    <label><input type="checkbox" id="feature3" name="features" value="performance"> Performance</label>
                    <label><input type="checkbox" id="feature4" name="features" value="design"> Design</label>
                </div>
            </div>

            <div class="form-group">
                <label for="review">Written Review (Optional):</label>
                <textarea id="review" name="review" rows="4"></textarea>
            </div>

            <div class="form-group">
                <label for="username">Your Name (Optional):</label>
                <input type="text" id="username" name="username">
            </div>

            <input type="submit" value="Post Review">
        </form>
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> Joseph Silas Ukandu | Nigeria</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
