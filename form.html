<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Review - WDD 131</title>
  <meta name="description" content="Product review submission form for WDD 131 dynamic web development coursework.">
  <meta name="author" content="Joseph Silas Ukandu">
  <link rel="stylesheet" href="styles/form.css">
  <script src="scripts/form.js" defer></script>
</head>
<body>
  <header>
    <h1>Product Review</h1>
  </header>

  <main>
    <form method="get" action="review.html">
      <!-- Product Select -->
      <div class="form-item">
        <label for="product-select">Product Name <span class="required" aria-hidden="true">*</span></label>
        <select id="product-select" name="productName" required>
          <option value="" disabled selected>Select a Product ...</option>
        </select>
      </div>

      <!-- Overall Rating -->
      <fieldset class="rating-fieldset">
        <legend>Overall Rating <span class="required" aria-hidden="true">*</span></legend>
        <div class="rating-group">
          <label for="star1">
            <input type="radio" id="star1" name="overallRating" value="1" required>
            <span class="star-label">&star;</span>
          </label>
          <label for="star2">
            <input type="radio" id="star2" name="overallRating" value="2" required>
            <span class="star-label">&star;&star;</span>
          </label>
          <label for="star3">
            <input type="radio" id="star3" name="overallRating" value="3" required>
            <span class="star-label">&star;&star;&star;</span>
          </label>
          <label for="star4">
            <input type="radio" id="star4" name="overallRating" value="4" required>
            <span class="star-label">&star;&star;&star;&star;</span>
          </label>
          <label for="star5">
            <input type="radio" id="star5" name="overallRating" value="5" required>
            <span class="star-label">&star;&star;&star;&star;&star;</span>
          </label>
        </div>
      </fieldset>

      <!-- Date of Installation -->
      <div class="form-item">
        <label for="install-date">Date of Installation <span class="required" aria-hidden="true">*</span></label>
        <input type="date" id="install-date" name="installDate" required>
      </div>

      <!-- Useful Features -->
      <fieldset class="features-fieldset">
        <legend>Which features did you find useful? <em>(Check all that apply)</em></legend>
        <label for="feature-durability">
          <input type="checkbox" id="feature-durability" name="features" value="durability"> Durability
        </label>
        <label for="feature-ease">
          <input type="checkbox" id="feature-ease" name="features" value="ease-of-use"> Ease of Use
        </label>
        <label for="feature-performance">
          <input type="checkbox" id="feature-performance" name="features" value="performance"> Performance
        </label>
        <label for="feature-design">
          <input type="checkbox" id="feature-design" name="features" value="design"> Design
        </label>
      </fieldset>

      <!-- Written Review -->
      <div class="form-item">
        <label for="review-text">Written Review <em>(Optional)</em></label>
        <textarea id="review-text" name="writtenReview" rows="4"></textarea>
      </div>

      <!-- User Name -->
      <div class="form-item">
        <label for="user-name">Your Name <em>(Optional)</em></label>
        <input type="text" id="user-name" name="userName">
      </div>

      <!-- Submit Button -->
      <input type="submit" value="Post Review" class="submit-btn">
    </form>
  </main>

  <footer>
    <p>&copy;<span id="currentyear"></span> Joseph Silas Ukandu | Nigeria</p>
    <p id="lastModified"></p>
  </footer>
</body>
</html>
