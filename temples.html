<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temple Album | WDD 131</title>
    <meta name="description" content="A responsive temple picture album featuring responsive design and dynamic navigation for WDD 131.">
    <meta name="author" content="Joseph Silas Ukandu">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <!-- External Stylesheets -->
    <link rel="stylesheet" href="styles/temples.css">
    <link rel="stylesheet" href="styles/temples-large.css">
    <!-- Deferred JavaScript -->
    <script src="scripts/temples.js" defer></script>
</head>
<body>
    <header>
        <h1>Temple Album</h1>
        <button id="menu" aria-label="Toggle navigation menu"></button>
        <nav class="navigation">
            <a href="#">Home</a>
            <a href="#">Old</a>
            <a href="#">New</a>
            <a href="#">Large</a>
            <a href="#">Small</a>
        </nav>
    </header>

    <main>
        <h2>Featured Temples</h2>
        <div class="res-grid">
            <figure>
                <img src="images/aba_nigeria_temple.jpeg" alt="Aba Nigeria Temple" loading="lazy">
                <figcaption>Aba Nigeria Temple</figcaption>
            </figure>
            <figure>
                <img src="images/accra_ghana_temple.jpeg" alt="Accra Ghana Temple" loading="lazy">
                <figcaption>Accra Ghana Temple</figcaption>
            </figure>
            <figure>
                <img src="images/logan_temple.jpeg" alt="Logan Utah Temple" loading="lazy">
                <figcaption>Logan Utah Temple</figcaption>
            </figure>
            <figure>
                <img src="images/manti_temple.jpeg" alt="Manti Utah Temple" loading="lazy">
                <figcaption>Manti Utah Temple</figcaption>
            </figure>
            <figure>
                <img src="images/nauvoo_temple.jpeg" alt="Nauvoo Illinois Temple" loading="lazy">
                <figcaption>Nauvoo Illinois Temple</figcaption>
            </figure>
            <figure>
                <img src="images/oakland_california_temple.jpeg" alt="Oakland California Temple" loading="lazy">
                <figcaption>Oakland California Temple</figcaption>
            </figure>
            <figure>
                <img src="images/paris_france_temple.jpeg" alt="Paris France Temple" loading="lazy">
                <figcaption>Paris France Temple</figcaption>
            </figure>
            <figure>
                <img src="images/salt_lake_temple.jpeg" alt="Salt Lake Temple" loading="lazy">
                <figcaption>Salt Lake Temple</figcaption>
            </figure>
            <figure>
                <img src="images/provo_utah_temple.jpeg" alt="Provo Utah Rock Canyon Temple" loading="lazy">
                <figcaption>Provo Utah Rock Canyon Temple</figcaption>
            </figure>
        </div>
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> Joseph Silas Ukandu | Nigeria</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
